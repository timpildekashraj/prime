<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient 360 Widget</title>
  <style>
    :root {
      --orange: #F37B20;
      --gray:   #6D6E70;
      --green:  #16a34a;
      --amber:  #d97706;
      --red:    #dc2626;
      --bg:     #f9fafb;
      --white:  #ffffff;
      --border: #e5e7eb;
      --text:   #111827;
      --muted:  #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      min-height: 100vh;
    }

    /* ── Alert bar ── */
    #alert-bar {
      display: none;
      background: var(--red);
      color: #fff;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
    }
    #alert-bar.show { display: block; }

    /* ── Main card ── */
    #card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* ── Score row ── */
    #score-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
    }

    #score-badge {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }
    #score-badge .band-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 1px;
      opacity: 0.9;
    }

    .band-green  { background: var(--green); }
    .band-amber  { background: var(--amber); }
    .band-red    { background: var(--red);   }

    #name-block { flex: 1; min-width: 0; }
    #patient-name    { font-weight: 700; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #patient-name-ar { font-size: 12px; color: var(--muted); direction: rtl; margin-top: 1px; }
    #patient-meta    { font-size: 10px; color: var(--muted); margin-top: 3px; }

    #stars { font-size: 13px; letter-spacing: 1px; }

    /* ── Metrics grid ── */
    #metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }
    .metric {
      padding: 7px 12px;
      border-right: 1px solid var(--border);
    }
    .metric:nth-child(even) { border-right: none; }
    .metric:nth-child(3),
    .metric:nth-child(4)   { border-top: 1px solid var(--border); }
    .metric-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
    .metric-value { font-size: 13px; font-weight: 700; color: var(--text); margin-top: 1px; }
    .metric-value.neg { color: var(--red); }
    .metric-value.pos { color: var(--green); }

    /* ── Signals list ── */
    #signals-section { padding: 8px 12px; }
    .sig-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px; }

    .sig-item {
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--bg);
      border-left: 3px solid var(--border);
      margin-bottom: 5px;
    }
    .sig-item.positive { border-left-color: var(--green); }
    .sig-item.negative { border-left-color: var(--red);   }
    .sig-item.neutral  { border-left-color: #9ca3af;      }

    .sig-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .sig-channel { font-size: 10px; font-weight: 600; color: var(--text); }
    .sig-date    { font-size: 9px;  color: var(--muted); }
    .sig-text    { font-size: 10px; color: var(--muted); line-height: 1.4;
                   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sig-sent    { font-size: 9px; font-weight: 600; margin-top: 2px; text-transform: capitalize; }
    .sig-sent.positive { color: var(--green); }
    .sig-sent.negative { color: var(--red);   }
    .sig-sent.neutral  { color: var(--muted); }

    /* ── Suggested Actions ── */
    #actions-section {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
    }
    .actions-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--orange); font-weight: 700; margin-bottom: 6px; }

    .action-item {
      display: flex;
      gap: 7px;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      margin-bottom: 5px;
      align-items: flex-start;
    }
    .action-item.urgent   { background: #fff7ed; border-color: #fed7aa; }
    .action-item.positive { background: #f0fdf4; border-color: #bbf7d0; }
    .action-item.neutral  { background: var(--bg); border-color: var(--border); }
    .action-icon  { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .action-body  { flex: 1; min-width: 0; }
    .action-title { font-size: 10px; font-weight: 700; color: var(--text); }
    .action-title.urgent   { color: #c2410c; }
    .action-title.positive { color: #15803d; }
    .action-title.neutral  { color: var(--text); }
    .action-desc  { font-size: 9px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

    /* ── Footer ── */
    #footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px 7px;
      border-top: 1px solid var(--border);
      background: #f3f4f6;
    }
    #footer-brand { font-size: 9px; font-weight: 700; color: var(--orange); letter-spacing: 0.04em; }
    #footer-time  { font-size: 9px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    #refresh-icon { display: inline-block; font-style: normal; transition: transform 0.3s; }
    #refresh-icon.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Loading skeleton ── */
    #loading {
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .skel {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Error state ── */
    #error-state {
      display: none;
      padding: 24px 12px;
      text-align: center;
      color: var(--red);
      font-size: 11px;
    }
    #error-state .err-icon { font-size: 28px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <!-- Alert bar (shows if open complaints / active alerts) -->
  <div id="alert-bar"></div>

  <!-- Loading state -->
  <div id="loading">
    <div class="skel" style="height:52px;width:100%;"></div>
    <div class="skel" style="height:14px;width:70%;"></div>
    <div class="skel" style="height:60px;width:100%;"></div>
    <div class="skel" style="height:40px;width:100%;"></div>
  </div>

  <!-- Error state -->
  <div id="error-state">
    <div class="err-icon">⚠</div>
    <div id="error-msg">Unable to load patient data</div>
  </div>

  <!-- Main card (hidden until loaded) -->
  <div id="card" style="display:none;">
    <div id="score-row">
      <div id="score-badge">
        <span id="score-val">—</span>
      </div>
      <div id="name-block">
        <div id="patient-name">—</div>
        <div id="patient-name-ar"></div>
        <div id="patient-meta">—</div>
      </div>
    </div>

    <div id="metrics">
      <div class="metric">
        <div class="metric-label">Sentiment</div>
        <div class="metric-value" id="m-sentiment">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Open Complaints</div>
        <div class="metric-value" id="m-complaints">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Visits (12m)</div>
        <div class="metric-value" id="m-visits">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Language</div>
        <div class="metric-value" id="m-language">—</div>
      </div>
    </div>

    <div id="signals-section">
      <div class="sig-label">Recent Signals</div>
      <div id="signals-list"></div>
    </div>

    <div id="actions-section" style="display:none;">
      <div class="actions-label">Suggested Actions</div>
      <div id="actions-list"></div>
    </div>

    <div id="footer">
      <span id="footer-brand">Patient 360</span>
      <span id="footer-time">
        <span id="refresh-icon">⟳</span>
        <span id="updated-time">—</span>
      </span>
    </div>
  </div>

  <script>
    const MRN = "{{ mrn }}";

    const CHANNEL_ICONS = {
      whatsapp:'💬', email:'📧', phone:'📞', google:'⭐',
      doctify:'🏥', survey:'📋', kiosk:'🖥️', app:'📱',
    };

    function starsHtml(count) {
      return Array.from({length: 5}, (_, i) =>
        `<span style="color:${i < count ? '#F37B20' : '#d1d5db'}">★</span>`
      ).join('');
    }

    function bandClass(b) {
      return b === 'green' ? 'band-green' : b === 'amber' ? 'band-amber' : 'band-red';
    }

    function fmt(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
    }

    function now() {
      return new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    }

    function setSpinning(on) {
      document.getElementById('refresh-icon').classList.toggle('spinning', on);
    }

    async function loadWidget() {
      setSpinning(true);
      try {
        const res = await fetch(`/api/widget/${MRN}`, { cache: 'no-store', headers: { 'ngrok-skip-browser-warning': 'true' } });
        if (!res.ok) {
          if (res.status === 404) showError('Patient not found: ' + MRN);
          else showError('Server error (' + res.status + ')');
          return;
        }
        const d = await res.json();
        render(d);
      } catch(e) {
        showError('Network error — check connection');
      } finally {
        setSpinning(false);
        document.getElementById('updated-time').textContent = 'Updated ' + now();
      }
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('card').style.display = 'none';
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-state').style.display = 'block';
    }

    function render(d) {
      // Alert bar
      const alertBar = document.getElementById('alert-bar');
      const topAlert = d.active_alerts && d.active_alerts[0];
      if (topAlert) {
        alertBar.textContent = '⚠ ALERT: ' + topAlert.summary;
        alertBar.classList.add('show');
      } else if (d.open_complaints > 0) {
        alertBar.textContent = `⚠ ${d.open_complaints} open complaint${d.open_complaints > 1 ? 's' : ''} — follow up required`;
        alertBar.classList.add('show');
      }

      // Score badge
      const badge = document.getElementById('score-badge');
      badge.className = 'band-' + d.colour_band;
      document.getElementById('score-val').textContent = d.score.toFixed(1);

      // Names
      document.getElementById('patient-name').textContent = d.name;
      const nameAr = document.getElementById('patient-name-ar');
      if (d.name_ar) nameAr.textContent = d.name_ar;
      document.getElementById('patient-meta').textContent =
        `${MRN} · Last visit: ${fmt(d.last_visit)}`;

      // Metrics
      const sentEl = document.getElementById('m-sentiment');
      sentEl.textContent = d.sentiment_trend || '—';
      sentEl.className = 'metric-value ' +
        (d.sentiment_trend === 'Positive' ? 'pos' : d.sentiment_trend === 'Declining' ? 'neg' : '');

      const compEl = document.getElementById('m-complaints');
      compEl.textContent = d.open_complaints;
      compEl.className = 'metric-value ' + (d.open_complaints > 0 ? 'neg' : 'pos');

      document.getElementById('m-visits').textContent = d.total_visits_12m || '—';
      document.getElementById('m-language').textContent = d.preferred_language || '—';

      // Signals
      const list = document.getElementById('signals-list');
      if (!d.signals || d.signals.length === 0) {
        list.innerHTML = '<div style="color:var(--muted);font-size:10px;text-align:center;padding:8px;">No signals yet</div>';
      } else {
        list.innerHTML = d.signals.map(s => {
        const ratingHtml = s.rating
          ? `<div style="font-size:11px;margin-bottom:2px;">${Array.from({length:5},(_,i)=>`<span style="color:${i<s.rating?'#F37B20':'#d1d5db'}">★</span>`).join('')}</div>`
          : '';
        return `
          <div class="sig-item ${s.sentiment}">
            <div class="sig-top">
              <span class="sig-channel">${CHANNEL_ICONS[s.channel] || '💬'} ${s.channel}</span>
              <span class="sig-date">${fmt(s.date)}</span>
            </div>
            ${ratingHtml}
            <div class="sig-text">${s.text}</div>
            <div class="sig-sent ${s.sentiment}">${s.sentiment}</div>
          </div>
        `;
      }).join('');
      }

      // Suggested actions
      renderActions(d);

      // Show card
      document.getElementById('loading').style.display = 'none';
      document.getElementById('card').style.display = 'block';
    }

    function buildActions(d) {
      const band    = d.colour_band;
      const signals = d.signals || [];
      const topics  = [...new Set(signals.map(s => s.topic))];
      const negSigs = signals.filter(s => s.sentiment === 'negative');
      const hasHigh = signals.some(s => s.urgency === 'high' || s.urgency === 'critical');
      const actions = [];

      if (band === 'red')
        actions.push({ icon:'🚨', type:'urgent', title:'Immediate Callback Required', desc:'Patient is at risk. Assign to Patient Relations Manager for same-day callback.' });

      if (topics.includes('billing'))
        actions.push({ icon:'💳', type:'urgent', title:'Resolve Billing Dispute', desc:'Coordinate with billing team to clarify insurance co-pay. Contact patient within 24 hours.' });

      if (negSigs.some(s => s.topic === 'wait_time'))
        actions.push({ icon:'⏱️', type:'urgent', title:'Notify Clinic Operations', desc:'Share queue feedback with clinic manager to review patient flow.' });

      if (negSigs.some(s => s.topic === 'nursing_staff'))
        actions.push({ icon:'👩‍⚕️', type:'urgent', title:'Escalate to Department Head', desc:'Staff behaviour complaint flagged. Requires HR review within 48 hours.' });

      if (negSigs.some(s => s.topic === 'reception'))
        actions.push({ icon:'🏨', type:'urgent', title:'Review Reception Experience', desc:'Notify front desk supervisor for immediate review.' });

      if (negSigs.some(s => s.topic === 'facility'))
        actions.push({ icon:'🏥', type:'urgent', title:'Facilities Maintenance Alert', desc:'Cleanliness concern raised. Notify facilities team for same-day inspection.' });

      if (topics.includes('appointment'))
        actions.push({ icon:'📅', type:'neutral', title:'Review Appointment Process', desc:'Check if booking notification process was followed correctly.' });

      if (topics.includes('pharmacy'))
        actions.push({ icon:'💊', type:'neutral', title:'Pharmacy Follow-Up', desc:'Contact pharmacy manager to address patient medication service concern.' });

      if (signals.some(s => s.topic === 'doctor_consultation' && s.sentiment === 'positive'))
        actions.push({ icon:'⭐', type:'positive', title:'Share Positive Feedback with Doctor', desc:'Patient praised the consultation. Forward appreciation to the clinical team.' });

      if (band === 'green' && d.open_complaints === 0) {
        actions.push({ icon:'🎁', type:'positive', title:'Invite to My Prime Rewards', desc:'High-satisfaction patient — ideal loyalty programme candidate.' });
        actions.push({ icon:'📝', type:'positive', title:'Request Public Review', desc:'Ask patient to leave a Google Review or Doctify testimonial.' });
      }

      if (band === 'amber')
        actions.push({ icon:'📋', type:'neutral', title:'Add Priority Note in HIS', desc:'Flag profile so all staff give extra attention at next visit.' });

      if (hasHigh && d.open_complaints > 0)
        actions.push({ icon:'📞', type:'urgent', title:`${d.open_complaints} Open Complaint${d.open_complaints > 1 ? 's' : ''} — Follow Up`, desc:'Unresolved complaints detected. Assign case manager for closure within 48 hours.' });

      return actions;
    }

    function renderActions(d) {
      const actions = buildActions(d);
      const section = document.getElementById('actions-section');
      const list    = document.getElementById('actions-list');
      if (actions.length === 0) { section.style.display = 'none'; return; }
      list.innerHTML = actions.map(a => `
        <div class="action-item ${a.type}">
          <span class="action-icon">${a.icon}</span>
          <div class="action-body">
            <div class="action-title ${a.type}">${a.title}</div>
            <div class="action-desc">${a.desc}</div>
          </div>
        </div>
      `).join('');
      section.style.display = 'block';
    }

    // Initial load
    loadWidget();

    // Auto-refresh every 30 seconds
    setInterval(loadWidget, 30000);
  </script>
</body>
</html>
